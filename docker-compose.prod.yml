# Production compose file — lives on the EC2 box.
# `docker compose -f docker-compose.prod.yml pull && up -d` after each release.
# Redis is a managed/hosted instance — its connection string lives in .env as REDIS_URL.
services:
  api:
    # Replace owner if your GHCR namespace differs. Must be lowercase.
    image: ghcr.io/dhavaldudheliya/supporthub-api:latest
    container_name: supporthub-api
    env_file: .env # DATABASE_URL, REDIS_URL (hosted), JWT/encryption keys, OAuth creds, etc.
    environment:
      PORT: 5000
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
